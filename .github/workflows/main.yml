name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web Code
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Auto Accept Android Licenses
        run: |
          mkdir -p -m 0730 "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"

      - name: Install Capacitor & Convert to Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # Определяем папку сборки
          WEB_DIR="dist"
          if [ -d "build" ]; then WEB_DIR="build"; fi
          if [ -d "public" ]; then WEB_DIR="public"; fi
          if [ -d ".lovable" ]; then WEB_DIR=".lovable"; fi
          
          # Фикс для Lovable: если в папке нет index.html, копируем его из корня
          if [ ! -f "$WEB_DIR/index.html" ]; then
            cp index.html $WEB_DIR/ 2>/dev/null || cp public/index.html $WEB_DIR/ 2>/dev/null || true
          fi
          
          if [ ! -d "android" ]; then
            npx cap init "Iryston" "com.iryston1990.irys" --web-dir=$WEB_DIR
            npx cap add android
          else
            echo "{\"appId\":\"com.iryston1990.irys\",\"appName\":\"Iryston\",\"webDir\":\"$WEB_DIR\"}" > capacitor.config.json
          fi
          
          # Создаем пустой файл плагинов, чтобы Gradle не ругался на его отсутствие
          mkdir -p android/app/src/main/assets
          echo "{}" > android/app/src/main/assets/capacitor.plugins.json
          
          npx cap sync android

      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk          
